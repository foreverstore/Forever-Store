<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forever-store | متجر المنتجات الرقمية للألعاب والاشتراكات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            
            <!-- Logo & Brand Name -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="filterCategory('all')">
                <div class="relative w-12 h-12 rounded-xl bg-slate-950/80 border border-teal-500/30 p-1 flex items-center justify-center shadow-lg shadow-teal-500/10 group hover:border-teal-400 transition-all">
                    <img src="forever-store.jpg" alt="forever-store logo" class="w-full h-full object-contain rounded-lg filter drop-shadow-[0_0_8px_rgba(20,184,166,0.5)]">
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-teal-400 via-cyan-300 to-indigo-400 bg-clip-text text-transparent drop-shadow-sm">
                        forever-store
                    </span>
                    <span class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Digital Gaming Store</span>
                </div>
            </div>

            <!-- Currency Selector & Cart Button -->
            <div class="flex items-center gap-3">
                <!-- Currency Switcher -->
                <select id="currencySelect" onchange="changeCurrency(this.value)" class="bg-slate-800 text-slate-200 border border-slate-700 text-xs sm:text-sm rounded-xl px-2.5 py-2 focus:outline-none focus:border-teal-500 transition-all font-semibold cursor-pointer">
                    <option value="JOD" selected>JOD (د.أ)</option>
                    <option value="USD">USD ($)</option>
                    <option value="SAR">SAR (ر.س)</option>
                </select>

                <!-- Cart Toggle Button -->
                <button onclick="toggleCartModal()" class="relative bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 border border-teal-500/30 font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span class="hidden sm:inline text-sm">السلة</span>
                    <span id="cartCountBadge" class="bg-teal-500 text-slate-950 text-xs font-extrabold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Top Weekend Offer Banner -->
    <div class="bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-400 text-slate-950 py-2.5 px-4 text-center text-xs sm:text-sm font-black tracking-wide shadow-md shadow-amber-500/10 flex items-center justify-center gap-2">
        <span>🔥</span>
        <span>اشتري أي لعبتين أوفلاين والثالثة علينا! (عرض فرصة الويكند)</span>
        <span>💥</span>
    </div>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

        <!-- Hero Section -->
        <section class="mb-10 text-center">
            <h1 class="text-3xl sm:text-5xl font-black mb-3 tracking-tight bg
