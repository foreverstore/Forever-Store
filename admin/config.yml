backend:
  name: github
  repo: foreverstore/Forever-Store
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "المنتجات والألعاب"
    files:
      - file: "products.json"
        label: "قائمة المنتجات"
        name: "products_list"
        fields:
          - { label: "المنتجات", name: "items", widget: "list", fields: [
              { label: "معرف المنتج (ID)", name: "id", widget: "string" },
              { label: "اسم المنتج", name: "name", widget: "string" },
              { label: "السعر (JOD)", name: "price", widget: "number", value_type: "float" },
              { label: "أيقونة FontAwesome", name: "iconClass", widget: "string" },
              { label: "القسم", name: "category", widget: "select", options: ["bestsellers", "bundles", "games", "discord", "subscriptions"] },
              { label: "الوصف التفصيلي", name: "desc", widget: "text" },
              { label: "ملاحظة سريعة", name: "note", widget: "string" },
              { label: "هل هي لعبة/بكج (إظهار الأسئلة الشائعة)؟", name: "isGameOrBundle", widget: "boolean", default: false },
              { label: "طلب عبر الواتساب مباشرة؟", name: "isWhatsApp", widget: "boolean", default: false }
            ]}
